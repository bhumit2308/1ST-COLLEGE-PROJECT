<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
    <defs>
        <!-- Industrial Safety Orange Gradient -->
        <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c2410c" /> <!-- Orange 700 -->
            <stop offset="100%" stop-color="#ea580c" /> <!-- Orange 600 -->
        </linearGradient>

        <!-- Sharp Rust Highlight -->
        <linearGradient id="highlight" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ea580c" /> <!-- Orange 600 -->
            <stop offset="100%" stop-color="#f97316" /> <!-- Orange 500 -->
        </linearGradient>

        <!-- Soft Drop Shadow for Depth -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
    </defs>
    
    <!-- The Monogram (Abstract Node 'B') -->
    <g transform="translate(4, 5)" filter="url(#shadow)">
        <!-- Vertical Data Pillar -->
        <rect x="0" y="2" width="7" height="36" rx="3.5" fill="url(#primary)" />
        
        <!-- Top Ring (AI Logic) -->
        <circle cx="13" cy="11" r="9" fill="none" stroke="url(#highlight)" stroke-width="4.5" stroke-dasharray="35 15" stroke-linecap="round" transform="rotate(-30 13 11)" />
        <circle cx="13" cy="11" r="9" fill="none" stroke="url(#primary)" stroke-width="4.5" opacity="0.25"/>

        <!-- Bottom Ring (Full-Stack Systems) -->
        <circle cx="15" cy="27" r="11" fill="none" stroke="url(#primary)" stroke-width="5" stroke-dasharray="50 15" stroke-linecap="round" transform="rotate(150 15 27)"/>
        <circle cx="15" cy="27" r="11" fill="none" stroke="url(#highlight)" stroke-width="5" opacity="0.2"/>
        
        <!-- Nexus Core (The Intersecting Spark) -->
        <circle cx="5" cy="19" r="4.5" fill="#ffffff" stroke="url(#highlight)" stroke-width="2"/>
    </g>

    <!-- The Typography -->
    <text x="44" y="34" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="900" fill="#171717" letter-spacing="-0.5">Bhumit<tspan fill="#ea580c">.</tspan></text>
</svg>
